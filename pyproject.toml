[project]
name = "datei-organizer"
version = "0.1.0"
description = "Dateien nach Kategorien organisieren – mit Desktop-Oberfläche, CLI, Sortiervorschau und Rückgängig-Funktion."
authors = [
    {name = "Fabian Sirtl"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "typer (>=0.27.3,<0.28.0)",
    "ttkbootstrap (>=2.2.7,<3)"
]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Repository = "https://github.com/fabsir06021982-dotcom/datei-organizer"
Issues = "https://github.com/fabsir06021982-dotcom/datei-organizer/issues"

[project.scripts]
cli-organizer = "datei_organizer.cli:run_cli"

[project.gui-scripts]
gui-organizer = "datei_organizer.gui:run_gui"
